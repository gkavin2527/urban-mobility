<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">Signalised four-way junction</title>
  <desc id="d">Schematic junction where east-west and north-south traffic take turns on green. Cars queue at red and cross on green.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .lbl{font-size:13px;font-weight:700;fill:#64748b}
    .state{font-size:14px;font-weight:600;fill:#e2e8f0}
    .cap{font-size:11.5px;fill:#64748b}
  </style>
  <rect width="640" height="360" rx="16" fill="#0b1220"/>
  <clipPath id="c"><rect width="640" height="360" rx="16"/></clipPath>
  <g clip-path="url(#c)">
    <!-- roads -->
    <rect x="0" y="140" width="640" height="80" fill="#1e293b"/>
    <rect x="280" y="0" width="80" height="360" fill="#1e293b"/>
    <g stroke="#475569" stroke-width="2" stroke-dasharray="10 10">
      <path d="M0 180H280M360 180H640M320 0V140M320 220V360"/>
    </g>
    <!-- stop lines -->
    <g stroke="#e2e8f0" stroke-width="3" opacity=".75">
      <path d="M272 180V220M368 140V180M280 132H320M320 228H360"/>
    </g>

    <!-- vehicles: blue = east-west, amber = north-south -->
    <g>
    <rect x="244" y="194" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.32;0.321;1" values="244;244;660;244;244"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.32;0.321;0.58;0.6;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="216" y="194" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.05;0.35;0.351;1" values="216;216;660;216;216"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.35;0.351;0.64;0.66;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="188" y="194" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.38;0.381;1" values="188;188;660;188;188"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.38;0.381;0.7;0.72;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="160" y="194" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.11;0.41;0.411;1" values="160;160;660;160;160"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.41;0.411;0.76;0.78;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="374" y="154" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.32;0.321;1" values="374;374;-40;374;374"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.32;0.321;0.58;0.6;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="402" y="154" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.05;0.35;0.351;1" values="402;402;-40;402;402"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.35;0.351;0.64;0.66;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="430" y="154" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.38;0.381;1" values="430;430;-40;430;430"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.38;0.381;0.7;0.72;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="458" y="154" width="22" height="12" rx="3" fill="#38bdf8">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" keyTimes="0;0.11;0.41;0.411;1" values="458;458;-40;458;458"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.41;0.411;0.76;0.78;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="294" y="106" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.52;0.82;0.821;1" values="106;106;380;106;106"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.04;0.06;0.82;0.821;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="294" y="78" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.55;0.85;0.851;1" values="78;78;380;78;78"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.12;0.85;0.851;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="294" y="50" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.58;0.88;0.881;1" values="50;50;380;50;50"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.16;0.18;0.88;0.881;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="294" y="22" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.61;0.91;0.911;1" values="22;22;380;22;22"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.22;0.24;0.91;0.911;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="334" y="234" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.52;0.82;0.821;1" values="234;234;-40;234;234"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.04;0.06;0.82;0.821;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="334" y="262" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.55;0.85;0.851;1" values="262;262;-40;262;262"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.12;0.85;0.851;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="334" y="290" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.58;0.88;0.881;1" values="290;290;-40;290;290"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.16;0.18;0.88;0.881;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="334" y="318" width="12" height="22" rx="3" fill="#fbbf24">
      <animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.61;0.91;0.911;1" values="318;318;-40;318;318"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.22;0.24;0.91;0.911;1" values="0;0;1;1;0;0"/>
    </rect>
    </g>
  </g>

  <!-- signals -->
  <g>
    <circle cx="262" cy="236" r="9" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="262" cy="236" r="5.5" fill="#22c55e">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.42;0.48" values="#22c55e;#facc15;#ef4444"/>
    </circle>
    <circle cx="378" cy="124" r="9" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="378" cy="124" r="5.5" fill="#22c55e">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.42;0.48" values="#22c55e;#facc15;#ef4444"/>
    </circle>
    <circle cx="266" cy="122" r="9" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="266" cy="122" r="5.5" fill="#ef4444">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.92;0.98" values="#ef4444;#22c55e;#facc15;#ef4444"/>
    </circle>
    <circle cx="374" cy="238" r="9" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="374" cy="238" r="5.5" fill="#ef4444">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.92;0.98" values="#ef4444;#22c55e;#facc15;#ef4444"/>
    </circle>
  </g>

  <!-- approach labels -->
  <text class="lbl" x="320" y="14" text-anchor="middle">N</text>
  <text class="lbl" x="320" y="356" text-anchor="middle">S</text>
  <text class="lbl" x="620" y="205" text-anchor="middle">E</text>
  <text class="lbl" x="20" y="165" text-anchor="middle">W</text>

  <!-- active phase -->
  <text class="state" x="20" y="34" opacity="1">East–West phase
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.48" values="1;0"/>
  </text>
  <text class="state" x="20" y="34" opacity="0">North–South phase
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.98" values="0;1;0"/>
  </text>
  <text class="cap" x="20" y="346">Schematic only · synthetic demand, not live traffic</text>
</svg>
